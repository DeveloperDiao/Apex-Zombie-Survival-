
name: Deploy APEX Admin to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-supabase:
    name: Deploy Supabase Edge Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase function exists
        run: |
          test -f supabase/functions/apex-admin/index.ts
          echo "APEX Admin source file found."

      - name: Verify deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF secret"
            exit 1
          fi

          echo "Required deployment credentials are configured."

      - name: Deploy apex-admin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy apex-admin \
            --project-ref "$SUPABASE_PROJECT_REF"
