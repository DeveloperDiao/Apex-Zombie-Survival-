
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#101715" />

  <title>APEX Zombie Survival</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101715;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font: bold 18px Arial, sans-serif;
      text-align: center;
      padding: 20px;
      width: 90%;
      box-sizing: border-box;
      z-index: 999;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>

  <script>
    function showStartupError(message) {
      const loading = document.getElementById("loading");

      if (loading) {
        loading.style.color = "#ff7777";
        loading.textContent =
          "APEX STARTUP ERROR\n\n" + message;
      }
    }

    window.addEventListener("error", function(event) {
      showStartupError(
        event.message || "Unknown JavaScript error"
      );
    });

    window.addEventListener(
      "unhandledrejection",
      function(event) {
        const reason = event.reason;

        showStartupError(
          reason && reason.message
            ? reason.message
            : String(reason)
        );
      }
    );
  </script>
</head>

<body>
  <div id="loading">Loading APEX Zombie Survival...</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
